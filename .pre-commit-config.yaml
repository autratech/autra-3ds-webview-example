repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: [--redact=100]
  - repo: local
    hooks:
      - id: node-test
        name: testes do exemplo 3DS
        language: system
        entry: npm test
        pass_filenames: false
        types: [javascript]
